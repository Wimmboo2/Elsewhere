name: Release APK

# Builds the release APK and publishes it as a GitHub Release with the APK attached:
# - every push to main or Claude updates the release for the current versionName (v1.0.0 -> "v1.0.0"),
#   so bump versionCode/versionName in app/build.gradle.kts to start a new release;
# - pushing a tag like v1.2.0, or running it from the Actions tab, releases that tag.
on:
  push:
    branches: [main, Claude]
    tags: ["v*"]
    # Docs-only pushes don't rebuild (and so don't replace) the release APK.
    paths-ignore: ["**.md", "docs/**", "verify/**", "design/**", "licenses/**"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create or update, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
      HAS_PRIVATE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Release tag from versionName (branch pushes)
        if: env.TAG == ''
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          echo "TAG=v$v" >> "$GITHUB_ENV"

      - name: Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - name: Private signing key (only if the secrets are set)
        if: env.HAS_PRIVATE_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ELSEWHERE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ELSEWHERE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ELSEWHERE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ELSEWHERE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "Elsewhere-$TAG.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="Download **Elsewhere-$TAG.apk** below and open it on your Android phone (Android 8.0+).
          First time: allow installs from your browser or Files app when Android asks, then follow the setup in the app
          (Developer options > Select mock location app > Elsewhere)."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "Elsewhere-$TAG.apk" --clobber
          else
            gh release create "$TAG" "Elsewhere-$TAG.apk" --title "Elsewhere $TAG" --notes "$notes" --target "$GITHUB_SHA"
          fi
